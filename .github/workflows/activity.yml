name: activity-map

on:
  schedule:
    - cron: "17 4 * * *"   # diario, 04:17 UTC
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["scripts/contrib.py", "scripts/glyphs.json", ".github/workflows/activity.yml"]

permissions:
  contents: write

concurrency:
  group: activity-map
  cancel-in-progress: true

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Renderizar mapa de contribuciones
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 scripts/contrib.py
      - name: Commit si cambió
        run: |
          if git diff --quiet assets/contributions.svg; then
            echo "Sin cambios"; exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/contributions.svg
          git commit -m "chore: actualizar mapa de actividad"
          git push
